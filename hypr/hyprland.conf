################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor = eDP-1,1366x768@60,0x0,1

############################################################

################
### KEYWORDS ###
################

$terminal = kitty
$fileManager = dolphin
# $menu = rofi -show drun
$menu = nwg-drawer -c 7 -is 70 -spacing 23
$mainMod = SUPER

############################################################

#################
### AUTOSTART ###
#################

exec-once = $terminal
exec-once = nm-applet --indicator
exec-once = waybar &
exec-once = kbuildsycoca6

# exec-once = hyprpaper & # hyprpaper.conf
exec-once = waypaper --restore # front end for hyprpaper (delay)
# exec-once = wpaperd &

exec-once = mako
exec-once =/usr/lib/polkit-kde-authentication-agent-1
exec-once = foot --server
exec-once=exec xrdb -load ~/.Xresources
exec-once = apply-gsettings
exec-once = hypridle

exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

############################################################

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = GDK_BACKEND,wayland,x11,*

env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

env = XDG_MENU_PREFIX,arch-

############################################################

#############
### INPUT ###
#############

input {
kb_layout = br
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default= true
    follow_mouse = 1

touchpad {
    natural_scroll = true
    tap-to-click = true
    disable_while_typing = true
}
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

############################################################

#####################
### LOOK AND FEEL ###
#####################

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 10
    border_size = 3
    col.active_border = rgba(6a00fcff) rgba(ff0e93ff) rgba(ffa10cff) rgba(ffef78ff) rgba(ff4360ff) rgba(ff059dff) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    blur {
       enabled = true
       size = 5
       passes = 1
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

gesture = 3, up, dispatcher, exec, garuda-rani
gesture = 3, down, dispatcher, exec, nwg-drawer -mb 10 -mr 10 -ml 10 -mt 10
gesture = 3, horizontal, workspace

misc {
	disable_hyprland_logo = true
}

############################################################

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$
# windowrulev2 = opacity 0.85 0.85,floating:1


############################################################

###################
### KEYBINDINGS ###
###################

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to workspace with focused container with ALT + SHIFT + [0-9]
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 6, movetoworkspace, 6
bind = ALT SHIFT, 7, movetoworkspace, 7
bind = ALT SHIFT, 8, movetoworkspace, 8
bind = ALT SHIFT, 9, movetoworkspace, 9
bind = ALT SHIFT, 0, movetoworkspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
# bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod SHIFT, B, exec, hyprctl reload

# Reinicia waybar
bind = $mainMod, B, exec, pkill waybar && waybar &

# Printscreen
bind = $mainMod, f10, exec, grim -g "$(slurp)"

# Controle de tela
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, L, togglefloating
bind = $mainMod, K, pseudo, # dwindle

# Ccnfiguração do hyprland (.config)
bind = $mainMod, O, exec, code .config
bind = $mainMod SHIFT, O, exec, $terminal -e nano .config/hypr/hyprland.co>

# Troca de wallpaper
bind = $mainMod SHIFT,C, exec, killall -9 wpaperd && wpaperd

# cliphist
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -display-columns>

# Controle de Audio
bind = $mainMod ALT_L, up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@>
bind = $mainMod ALT_L, down, exec, wpctl set-volume @DEFAULT_AUDIO_SIN>

# Controle de midia
bind = $mainMod, f6, exec, playerctl previous
bind = $mainMod, f8, exec, playerctl next
bind = $mainMod, f7, exec, playerctl play-pause

# Controle de Brilho
bind = $mainMod, F2, exec, brightnessctl set 10%-
bind = $mainMod, F3, exec, brightnessctl set +10%

# Troca de workspace ativa
bind = $mainMod, TAB, workspace, e+1
bind = $mainMod SHIFT, right, workspace, e+1
bind = $mainMod SHIFT, left, workspace, e-1
